server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: golang-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: golang-services
          __path__: /var/log/golang/*.log

  - job_name: loki
    static_configs:
      - targets:
          - localhost
        labels:
          job: loki
          __path__: /var/log/loki/*.log
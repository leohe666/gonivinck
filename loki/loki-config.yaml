auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  allow_structured_metadata: false
  # 日志保留期：仅保留最近 48h，更早的由 compactor 自动删除
  retention_period: 48h

# WAL 磁盘保护阈值通过 docker-compose 的 CLI flag 注入：
#   -ingester.wal-disk-full-threshold=0.99
# （该 flag 不存在于 YAML 的 ingester 块；宿主数据卷使用率偏高时 Loki 默认 0.9 会拒绝写入，
#   本项目日志量极小，磁盘压力来自宿主其他应用，调高避免误伤，设 0 可完全禁用检查）

# compactor：启用保留期清理，定期删除超过 retention_period 的旧日志
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  # 单机 filesystem 部署：删除请求存储也必须指向 filesystem（Loki 3.7 校验要求）
  delete_request_store: filesystem
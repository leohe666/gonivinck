version: '3.5'

# 网络配置
networks:
  backend:
    driver: ${NETWORKS_DRIVER}

# 服务容器配置
services:
  golang:                                # 开发环境容器
      build:
        context: ./golang
      environment:
        - TZ=${TZ}
        # 限制 go 编译并行度,避免 9 个服务同时构建时 OOM (Docker VM 内存有限)
        - GOFLAGS=-p=1
      volumes:
        - ${CODE_PATH_HOST}:/usr/src/code
        - ${DATA_PATH_HOST}/golang:/var/log/golang
        # 持久化 go 模块缓存与构建缓存,容器重建后无需全量冷编译
        - ${DATA_PATH_HOST}/golang-mod:/go/pkg/mod
        - ${DATA_PATH_HOST}/golang-build:/root/.cache/go-build
      privileged: true
      ports:
        - "8000:8000"
        - "8001:8001"
        - "8002:8002"
        - "8003:8003"
        - "8888:8888"
        - "9000:9000"
        - "9001:9001"
        - "9002:9002"
        - "9003:9003"
        - "9080:9080"
        - "9081:9081"
        - "9082:9082"
        - "9083:9083"
        - "9090:9090"
        - "9091:9091"
        - "9092:9092"
        - "9093:9093"
      stdin_open: true
      tty: true
      networks:
        - backend
      restart: always
      command: >
        sh -c "
          cd /usr/src/code &&
          chmod +x start-services.sh &&
          # 启动 9 个 air (每服务独立监听) + 进程守护
          make run
        "

  etcd:                                  # etcd 服务
    image: bitnamilegacy/etcd:3.5
    environment:
      - TZ=${TZ}
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - "${ETCD_PORT}:2379"
    volumes:
      - ${DATA_PATH_HOST}/etcd:/bitnami/etcd
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    environment:
      - TZ=${TZ}
      - MYSQL_USER=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    privileged: true
    volumes:
      - ${DATA_PATH_HOST}/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2-alpine
    environment:
      - TZ=${TZ}
    privileged: true
    volumes:
      - ${DATA_PATH_HOST}/redis:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # mysql-manage:
  #   image: phpmyadmin/phpmyadmin:latest
  #   environment:
  #     - TZ=${TZ}
  #     - PMA_ARBITRARY=1
  #     - MYSQL_USER=${MYSQL_MANAGE_USERNAME}
  #     - MYSQL_PASSWORD=${MYSQL_MANAGE_PASSWORD}
  #     - MYSQL_ROOT_PASSWORD=${MYSQL_MANAGE_ROOT_PASSWORD}
  #     - PMA_HOST=${MYSQL_MANAGE_CONNECT_HOST}
  #     - PMA_PORT=${MYSQL_MANAGE_CONNECT_PORT}
  #   ports:
  #     - "${MYSQL_MANAGE_PORT}:80"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - backend
  #   restart: always

  # redis-manage:
  #   image: rediscommander/redis-commander:latest
  #   environment:
  #     - TZ=${TZ}
  #     - ADMIN_USER=${REDIS_MANAGE_USERNAME}
  #     - ADMIN_PASS=${REDIS_MANAGE_PASSWORD}
  #     - REDIS_HOSTS=local:host=${REDIS_MANAGE_CONNECT_HOST},port=${REDIS_MANAGE_CONNECT_PORT}
  #   ports:
  #     - "${REDIS_MANAGE_PORT}:8081"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - backend
  #   restart: always

  prometheus:
    image: prom/prometheus:latest
    environment:
      - TZ=${TZ}
    privileged: true
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml
      - ${DATA_PATH_HOST}/prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    environment:
      - TZ=${TZ}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ${DATA_PATH_HOST}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - TZ=${TZ}
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_PORT}:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 3

  dtm:
    image: yedf/dtm:latest
    environment:
      - TZ=${TZ}
    entrypoint:
      - "/app/dtm/dtm"
      - "-c=/app/dtm/configs/config.yaml"
    privileged: true
    volumes:
      - ./dtm/config.yml:/app/dtm/configs/config.yaml
    ports:
      - "${DTM_HTTP_PORT}:36789"
      - "${DTM_GRPC_PORT}:36790"
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:36789/"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:latest
    environment:
      - TZ=${TZ}
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - ${DATA_PATH_HOST}/loki:/loki
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  promtail:
    image: grafana/promtail:latest
    environment:
      - TZ=${TZ}
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      - ${DATA_PATH_HOST}/golang:/var/log/golang:ro
      - ${DATA_PATH_HOST}/loki:/var/log/loki:ro
    networks:
      - backend
    restart: always
    depends_on:
      - loki

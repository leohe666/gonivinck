apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # TraceID -> Grafana 内部跳转：在 Explore 右侧打开 Jaeger 面板并查询该 trace
        # （不跳外部页面）。url 模板会插值成 trace id 作为 Jaeger 的 query 值，
        # datasourceUid 指向 jaeger 数据源；两者组合才是 Grafana 内部链接。
        - name: TraceID
          matcherRegex: '"trace":"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        tags: []

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    isDefault: true